name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
permissions:
  contents: read
jobs:
  deploy:
    # Public repo: only main of this repo deploys, even when run by hand.
    if: github.repository == 'walangstudio/walang.studio' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
